[project]
name = "telecom-rag"
version = "0.1.0"
description = "RAG-based Telecom Chatbot with ChromaDB multi-collection merged retrieval and Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.7.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
